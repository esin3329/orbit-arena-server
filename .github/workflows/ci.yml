name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Cloudflare 잡(스모크·배포)이 같은 wrangler 버전을 쓰도록 고정
  WRANGLER_VERSION: 4.168.0
  WRANGLER_SEND_METRICS: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # 로컬 Supabase 스택(Postgres + PostgREST + Kong)에 마이그레이션을 적용하고
  # 실제 supabase-js 어댑터로 Repository 계약 테스트를 돌린다 (test 잡에서는 Supabase 쪽이 skip 됨)
  supabase:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (migrations applied on start)
        # auth(gotrue)는 제외하지 않는다: 제외하면 최신 CLI 가 status 에 API 키를 출력하지 않는다
        run: supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector
      - name: Repository contract test (Supabase adapter)
        run: |
          status="$(supabase status -o json)"
          export SUPABASE_TEST_URL="$(echo "$status" | jq -r '.API_URL // empty')"
          export SUPABASE_TEST_SERVICE_ROLE_KEY="$(echo "$status" | jq -r '.SERVICE_ROLE_KEY // .SECRET_KEY // empty')"
          # 로컬 스택의 키는 공개된 데모 키라 출력해도 안전하다
          if [ -z "$SUPABASE_TEST_URL" ] || [ -z "$SUPABASE_TEST_SERVICE_ROLE_KEY" ]; then echo "$status"; exit 1; fi
          REQUIRE_SUPABASE=1 node --test test/repository.test.ts
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t orbit-arena-server .
      - name: Smoke test (health check)
        run: |
          docker run -d --name oa -p 3000:3000 -e TOKEN_SECRET="$(openssl rand -hex 32)" orbit-arena-server
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs oa
          exit 1

  # 라이브 데모가 실제로 실행하는 cloudflare/worker.ts 를 로컬 workerd(wrangler dev)로 띄워
  # 정적 에셋 → REST → Durable Object(SQLite) → WebSocket → 매치 시작 → 바이너리 스냅샷까지 확인한다
  cloudflare:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stage static assets
        run: node scripts/cf-stage-assets.ts
      - name: Smoke test (wrangler dev)
        run: |
          npx -y wrangler@"$WRANGLER_VERSION" dev --port 8787 --ip 127.0.0.1             --var TOKEN_SECRET:"$(openssl rand -hex 32)" --var MATCH_BOT_FILL_AFTER_MS:500 > wrangler.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8787/health > /dev/null; then break; fi
            sleep 1
          done
          node scripts/cf-smoke.ts http://127.0.0.1:8787 || { cat wrangler.log; exit 1; }

  # main 에 병합되고 모든 검증이 통과하면 Cloudflare 에 배포한다.
  # 저장소 시크릿 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID 가 없으면 배포를 건너뛴다(포크·초기 설정용).
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, supabase, docker, cloudflare]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment:
      name: production
      url: https://orbit-arena-server.qlqlf2226.workers.dev
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Stage static assets
        run: node scripts/cf-stage-assets.ts
      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN 시크릿이 없어 배포를 건너뜁니다"
            exit 0
          fi
          npx -y wrangler@"$WRANGLER_VERSION" deploy
      - name: Verify production health
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://orbit-arena-server.qlqlf2226.workers.dev/health; then exit 0; fi
            sleep 2
          done
          exit 1
