name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  # 로컬 Supabase 스택(Postgres + PostgREST + Kong)에 마이그레이션을 적용하고
  # 실제 supabase-js 어댑터로 Repository 계약 테스트를 돌린다 (test 잡에서는 Supabase 쪽이 skip 됨)
  supabase:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start local Supabase (migrations applied on start)
        run: supabase start -x gotrue,realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector
      - name: Repository contract test (Supabase adapter)
        run: |
          status="$(supabase status -o json)"
          export SUPABASE_TEST_URL="$(echo "$status" | jq -r '.API_URL')"
          export SUPABASE_TEST_SERVICE_ROLE_KEY="$(echo "$status" | jq -r '.SERVICE_ROLE_KEY')"
          # 로컬 스택의 키는 공개된 데모 키라 출력해도 안전하다
          if [ "$SUPABASE_TEST_URL" = null ] || [ "$SUPABASE_TEST_SERVICE_ROLE_KEY" = null ]; then echo "$status"; exit 1; fi
          REQUIRE_SUPABASE=1 node --test test/repository.test.ts
      - name: Stop Supabase
        if: always()
        run: supabase stop --no-backup

  docker:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build image
        run: docker build -t orbit-arena-server .
      - name: Smoke test (health check)
        run: |
          docker run -d --name oa -p 3000:3000 -e TOKEN_SECRET="$(openssl rand -hex 32)" orbit-arena-server
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs oa
          exit 1
